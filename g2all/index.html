<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME STATION - [5.05] 7.00 - 14.00 FW GoldHEN Host</title>
<style>
  :root {
    --primary-color: #0072CE; /* PlayStation Blue */
    --accent-color: #00D2FF;
    --bg-color: #0d0f12;
    --card-bg: rgba(255, 255, 255, 0.05);
    --text-color: #ffffff;
    --text-dim: #a0a0a0;
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at center, #1a233a 0%, #0d0f12 100%);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 95vh;
    box-sizing: border-box;
    text-align: center;
  }

  .header {
    margin-top: 10px;
    margin-bottom: 20px;
  }

  .logo {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(0, 114, 206, 0.6);
  }

  .logo span {
    color: var(--accent-color);
  }

  .sub-title {
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .phones-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .phone-badge {
    background: rgba(0, 210, 255, 0.1);
    border: 1px solid rgba(0, 210, 255, 0.3);
    color: var(--accent-color);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    direction: ltr;
  }

  .main-container {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 35px 25px;
    max-width: 750px;
    width: 100%;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    backdrop-filter: blur(4px);
    box-sizing: border-box;
    margin: 20px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 220px;
  }

  #msgs {
    font-size: 22px;
    font-weight: 600;
    color: var(--accent-color);
    margin: 0;
    transition: all 0.2s ease;
    text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
  }

  .footer {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 15px;
    width: 100%;
    text-align: center;
  }

  .footer a {
    color: #f31414;
    text-decoration: none;
    margin: 0 5px;
  }

  .footer a:hover {
    text-decoration: underline;
  }
</style>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.00";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
		else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
</head>
<body>

  <!-- Header Section -->
  <div class="header">
    <div class="logo">GAME STATION <span>store</span></div>
    <div class="sub-title">صفحه التعديل الخاصه بشركه جيم ستيشن</div>
    <div class="phones-container">
      <span class="phone-badge">📞 01200783373</span>
      <span class="phone-badge">📞 03 3553423</span>
    </div>
  </div>

  <!-- Main Container for Status Message -->
  <div class="main-container">
    <h1 id="msgs">جارى تجميل الجولد هين ... برجاء الانتظار</h1>
  </div>

  <!-- Footer Credits -->
  <div class="footer">
    Special Thanks to: 
    <a href="1">MO FATHY</a> 
  </div>

</body>
</html>
